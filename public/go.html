<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在安全跳转至官网...</title>
  <meta name="description" content="正在安全跳转至官方授权中转节点，建立加密重定向通道，请稍候。">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1, h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 0.75rem;
    }
    .btn-secondary:hover {
      background: var(--border);
    }
    .hidden {
      display: none !important;
    }
    .notice {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading-state">
      <div class="spinner"></div>
      <h1 id="title">正在安全跳转至官网...</h1>
      <p id="desc">正在为您建立加密中转通道，请稍候</p>
      <a id="manual-btn" href="#" rel="nofollow sponsored noopener noreferrer" class="btn">
        未自动跳转？点击此处立即进入
      </a>
      <div class="notice">
        本链接已启用 SSL 加密与合规隔离，正在重定向至官方授权节点
      </div>
    </div>

    <div id="error-state" class="hidden">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">⚠️</div>
      <h2>未找到指定服务商</h2>
      <p>请求的跳转参数不存在或已失效，请返回评测榜单重新挑选。</p>
      <a id="home-btn" href="./" class="btn">返回首页排行榜</a>
    </div>
  </div>

  <script>
    (function() {
      // 外部 AFF 推广直链映射字典
      var TARGETS = {
        'yunjiexian': { name: '云界线', url: 'https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L' },
        'dalaoyun': { name: '大佬云', url: 'https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V' },
        'huanqiuti': { name: '环球梯', url: 'https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU' },
        'shandianshu': { name: '闪电鼠', url: 'https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg' },
        'liulianyun': { name: '榴莲云', url: 'https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR' },
        'shenxing': { name: '神行加速', url: 'https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK' },
        'edgenova': { name: '边缘节点', url: 'https://wep.edgenovaaff.com/#/?code=nr2Kdl68' },
        'kosing': { name: '可信云', url: 'https://everett7623.kosingaff.com/#/?code=MAbPRm7J' },
        'kuaili': { name: '快狸', url: 'https://fanxiaobin.kuailiaff.com/#/?code=MOD3Jbg2' }
      };

      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (!id && window.location.hash) {
        id = window.location.hash.replace(/^#\/?/, '');
      }

      var item = id ? TARGETS[id] : null;

      if (item && item.url) {
        document.title = '正在安全前往 ' + item.name + ' 官网...';
        var titleEl = document.getElementById('title');
        var descEl = document.getElementById('desc');
        var btnEl = document.getElementById('manual-btn');

        if (titleEl) titleEl.textContent = '正在前往 ' + item.name + ' 官网...';
        if (descEl) descEl.textContent = '正为您接入官方注册通道，享受专属优惠立减';
        if (btnEl) btnEl.href = item.url;

        // 立即通过 location.replace 进行无痕跳转
        try {
          window.location.replace(item.url);
        } catch(e) {
          window.location.href = item.url;
        }
      } else {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
