# ==============================================================================
# Nginx 301 永久重定向配置 (AFF 推广链接隔离与合规改造)
#
# 使用指南：
# 1. 适用于宝塔面板、1Panel、LNMP 等 VPS 环境；
# 2. 将本文件放置于网站根目录，在 Nginx 站点的 server { ... } 配置块中添加：
#    include /www/wwwroot/your-site/nginx-redirects.conf;
# 3. 执行 nginx -t 检查语法，然后执行 nginx -s reload 即可生效。
# ==============================================================================

# 标准 /go/:id 301 永久重定向
location ^~ /go/ {
    # 强制告知搜索引擎爬虫不得索引重定向路径
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /go/yunjiexian { return 301 "https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L"; }
    location = /go/dalaoyun   { return 301 "https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V"; }
    location = /go/huanqiuti  { return 301 "https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU"; }
    location = /go/shandianshu{ return 301 "https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg"; }
    location = /go/liulianyun { return 301 "https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR"; }
    location = /go/shenxing   { return 301 "https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK"; }
    location = /go/edgenova   { return 301 "https://wep.edgenovaaff.com/#/?code=nr2Kdl68"; }
    location = /go/kosing     { return 301 "https://everett7623.kosingaff.com/#/?code=MAbPRm7J"; }
    location = /go/kuaili     { return 301 "https://fanxiaobin.kuailiaff.com/#/?code=MOD3Jbg2"; }

    # 未匹配到的 ID 返回 404 或重定向至首页
    return 302 /;
}

# 兼容子目录部署环境 /jichangtuijian/go/:id
location ^~ /jichangtuijian/go/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /jichangtuijian/go/yunjiexian { return 301 "https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L"; }
    location = /jichangtuijian/go/dalaoyun   { return 301 "https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V"; }
    location = /jichangtuijian/go/huanqiuti  { return 301 "https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU"; }
    location = /jichangtuijian/go/shandianshu{ return 301 "https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg"; }
    location = /jichangtuijian/go/liulianyun { return 301 "https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR"; }
    location = /jichangtuijian/go/shenxing   { return 301 "https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK"; }
    location = /jichangtuijian/go/edgenova   { return 301 "https://wep.edgenovaaff.com/#/?code=nr2Kdl68"; }
    location = /jichangtuijian/go/kosing     { return 301 "https://everett7623.kosingaff.com/#/?code=MAbPRm7J"; }
    location = /jichangtuijian/go/kuaili     { return 301 "https://fanxiaobin.kuailiaff.com/#/?code=MOD3Jbg2"; }

    return 302 /jichangtuijian/;
}

# /go.html 承接页禁止索引响应头设置
location ~* ^/(jichangtuijian/)?go\.html$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
